name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Cache native build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: epub4j-native/cpp/build
          key: native-${{ runner.os }}-${{ hashFiles('epub4j-native/cpp/CMakeLists.txt', 'epub4j-native/cpp/src/**', 'epub4j-native/cpp/include/**') }}
          restore-keys: native-${{ runner.os }}-

      - run: ./gradlew clean check --warning-mode all
        env:
          JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED --enable-preview"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: '**/build/reports/tests/**'
